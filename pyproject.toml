[project]
name = "audit-distill"
version = "0.1.0"
description = "Reproducible synthetic audit distillation research pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "pyarrow>=19",
  "scikit-learn>=1.6,<2",
  "transformers>=4.51,<5",
  "tqdm>=4.67,<5",
  "jinja2>=3.1,<4",
]

[dependency-groups]
dev = ["ruff>=0.11"]
train = [
    "accelerate>=1.15",
    "peft>=0.21,<1",
    "torch>=2.9",
    "trl>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_distill"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# CUDA 12.6 wheels run on a wide range of drivers (Colab VMs); CPU elsewhere.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
